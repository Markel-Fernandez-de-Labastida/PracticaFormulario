<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

    <form action="" method="post" target="_blank" name="registro_en_el_club" accept-charset="UTF-8">
        <h1>Registro en el club</h1>
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre">
        <br>
        <label for="apellido">Apellido: </label>
        <input type="text" id="apellido" name="apellido">
        <br>
        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad">
        <br>
        <p>
            Genero: 
            <input type="radio" id="hombre" name="hombre" value="hombre">
            <label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="mujer" value="mujer">
            <label for="mujer">Mujer</label>
        </p>
        <label for="perteneciaClub">Te sientes del club? </label>
        <input type="checkbox" id="perteneciaClub" name="perteneciaClub" value="si">
        <br>
        <br>
        <label for="comentario">Di algo sobre ti: </label><br>
        <textarea name="comentario" id="comentario" rows="5" cols="50" placeholder="Escribe aquí"></textarea>

        <p>Datos de Contacto</p>

        <label for="correo">Correo electronico: </label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com">
        <br>
        <label for="telefono">Telefono: </label>
        <input type="tel" id="telefono" name="telefono" placeholder="123-456-7890">

    </form>

    <form action="" method="post" target="_blank" name="registro_del_robo_de_la_bicicleta" accept-charset="UTF-8">
        <h1>Registro del robo de la bicicleta</h1>
        <label for="dia">Dia: </label>
        <input type="date" id="dia" name="dia">

    </form>
    
</body>

</html>
