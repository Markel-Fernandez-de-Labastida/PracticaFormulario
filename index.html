<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main>
        <article>
            <form action="./index.html" 
            method="post" 
            enctype="multipart/form-data" 
            target="_blank" 
            autocomplete="on" 
            novalidate 
            name="formularioDeRegistro" 
            accept-charset="UTF-8"
            rel="noopener noreferrer">
            
                <fieldset>
                    <legend>Registro en el club</legend>
                    <h1>Registro en el club</h1>
                    <label for="nombre">Nombre: </label>
                    <input type="text" id="nombre" name="nombre">
                    <br>
                    <label for="apellido">Apellido: </label>
                    <input type="text" id="apellido" name="apellido">
                    <br>
                    <label for="edad">Edad: </label>
                    <input type="number" id="edad" name="edad">
                    <br>
                    <p>
                        Genero: 
                        <input type="radio" id="hombre" name="genero" value="hombre">
                        <label for="hombre">Hombre</label>
                        <input type="radio" id="mujer" name="genero" value="mujer">
                        <label for="mujer">Mujer</label>
                    </p>
                    <label for="perteneciaClub">Te sientes del club? </label>
                    <input type="checkbox" id="perteneciaClub" name="perteneciaClub" value="si">
                    <br>
                    <br>
                    <label for="comentario">Di algo sobre ti: </label><br>
                    <textarea name="comentario" id="comentario" rows="5" cols="50" placeholder="Escribe aquí"></textarea>

                    <p>Datos de Contacto</p>

                    <label for="correo">Correo electronico: </label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" tabindex="1" required>
                    <br>
                    <label for="telefono">Telefono: </label>
                    <input type="tel" id="telefono" name="telefono" placeholder="123-456-7890">
                    <br>
                    <input type="reset" value="reiniciar">
                    <input type="submit" value="Enviar">

                </fieldset>
            </form>
        </article>
        <article>
            <form action="./index.html" 
            method="post" 
            enctype="multipart/form-data" 
            target="_blank" 
            autocomplete="on" 
            novalidate 
            name="formularioDeRegistro" 
            accept-charset="UTF-8"
            rel="noopener noreferrer">
                <fieldset> 
                    <legend>Registro de un robo de bicicleta</legend>       
                    <h1>Registro del robo de la bicicleta</h1>
                    <label for="dia">Dia: </label>
                    <input type="date" id="dia" name="dia" autofocus>
                    <br>
                    <label for="hora">Hora: </label>
                    <input type="time" id="hora" name="hora">
                    <br>
                    <label for="color">Color: </label>
                    <input type="color" id="color" name="color">
                    <br>
                    <label for="rango_precio">Rango de precio: </label>
                    <input type="range" id="rango_precio" name="rango_precio" min="0" max="100">
                    <br>

                    <label for="tipo_bicicleta">Tipo de bicicleta: </label>
                    <br>
                    <label for="tipo_bicicleta_urbana">Urbana</label>
                    <select id="tipo_bicicleta_urbana" name="tipo_bicicleta_urbana" selected>
                        <option value="bicicleta_clasica">Bicicleta Clasica</option>
                        <option value="bicicleta_plegable">Bicicleta Plegable</option>
                        <option value="bicicleta_electrica">Bicicleta Electrica</option>
                        <option value="bicicleta_commuter">Bicicleta Commuter</option>
                    </select>
                    <br>
                    <label for="tipo_bicicleta_montana">Montaña</label>
                    <select id="tipo_bicicleta_montana" name="tipo_bicicleta_montana">
                        <option value="bicicleta_tipo_sport">Bicicleta de tipo Sport</option>
                        <option value="bicicleta_tipo_trail_hard_tail">Bicicleta de tipo Trail o Hard tail</option>
                        <option value="bicicleta_tipo_xc_cross_country">Bicicleta para XC o Cross Country</option>
                    </select>
                    <br>
                    <label for="tipo_bicicleta_carreras">Carreras</label>
                    <select id="tipo_bicicleta_carreras" name="tipo_bicicleta_carreras">
                        <option value="bicicleta_gran_fondo">Bicicleta Gran Fondo</option>
                        <option value="bicicleta_racing">Bicicleta Racing</option>
                        <option value="bicicleta_aero">Bicicleta Aero</option>
                    </select>
                    <br>
                    <label for="accesorios">Accesorios: </label>
                    <select id="accesorios" name="accesorios" multiple>
                        <option value="accesorios_ruedines">Ruedines</option>
                        <option value="accesorios_hinchadores">Hinchadores</option>
                        <option value="accesorios_rodillos">Rodillos</option>
                        <option value="accesorios_bomba_aire">Bomba de aire</option>
                        <option value="accesorios_alforja">Alforja</option>
                        <option value="accesorios_silla_portabebes">Silla portabebés</option>
                    </select>
                    <br>
                    <label for="marcas">¿Que marca era?</label>
                    <select id="marcas" name="marcas" selected>
                        <option value="marcas_specialized">Specialized</option>
                        <option value="marcas_trek">Trek</option>
                        <option value="marcas_merida">Merida</option>
                        <option value="marcas_scott">Scott</option>
                        <option value="marcas_giant">Giant</option>
                        <option value="marcas_cube">Cube</option>
                        <option value="marcas_lapierre">Lapierre</option>
                        <option value="marcas_orbea">Orbea</option>
                        <option value="marcas_cannondale">Cannondale</option>
                        <option value="marcas_bmc">BMC</option>
                        <option value="marcas_canyon">Canyon</option>
                        <option value="marcas_look">Look</option>
                        <option value="marcas_protek">Protek</option>
                        <option value="marcas_megamo">Megamo</option>
                        <option value="marcas_pinarello">Pinarello</option><option value="marcas_scott">Scott</option>
                        <option value="marcas_bianchi">Bianchi</option>
                        <option value="marcas_bh">BH</option>
                        <option value="marcas_factor">Factor</option>
                        <option value="marcas_ghost">Ghost</option>
                        <option value="marcas_cervelo">Cervélo</option>
                        <option value="marcas_argon">Argon</option>
                    </select>
                    <br>
                    <input type="reset" value="reiniciar">
                    <input type="submit" value="Enviar">
                </fieldset>
            </form>
        </article>
    </main>
</body>

</html>
